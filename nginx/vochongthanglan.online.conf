# Cấu hình Nginx cho vochongthanglan.online (Proxy đến Next.js cổng 5200)

server {
    listen 80;
    listen [::]:80;
    server_name vochongthanglan.online www.vochongthanglan.online;

    # Tối ưu kích thước payload
    client_max_body_size 25M;

    # Gzip nén dữ liệu cho web load siêu nhanh
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;

        # Hỗ trợ WebSockets / Next.js Fast Refresh
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Truyền thông tin header chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
