<!-- MUSIC + MAHOGANY BROWN WEDDING TONE MUSIC TOGGLE -->

<style>
  :root {
    --brown-main: #7a3519;
    --brown-main-2: #8a4425;
    --brown-dark: #5f2510;
    --brown-soft: #b78772;
    --brown-soft-2: #f2e6df;
    --brown-light: #fcf8f5;
    --brown-border: rgba(122, 53, 25, 0.34);
    --brown-shadow: rgba(95, 37, 16, 0.16);
    --brown-glow: rgba(138, 68, 37, 0.24);
    --brown-slash: #a06d57;
  }

  #music-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;

    width: 54px;
    height: 54px;

    border: none;
    border-radius: 50%;

    background: linear-gradient(
      135deg,
      rgba(252, 249, 247, 0.97),
      rgba(245, 236, 231, 0.97)
    );

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 99999;
    cursor: pointer;

    box-shadow:
      0 8px 22px var(--brown-shadow),
      inset 0 0 0 1px var(--brown-border);

    transition: all 0.28s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    padding: 0;
  }

  #music-toggle:hover {
    transform: translateY(-3px) scale(1.03);

    box-shadow:
      0 10px 28px rgba(95, 37, 16, 0.22),
      inset 0 0 0 1px rgba(122, 53, 25, 0.52);
  }

  #music-icon {
    width: 31px;
    height: 31px;

    color: var(--brown-main);

    filter: drop-shadow(0 2px 4px rgba(95, 37, 16, 0.14));

    transition: all 0.25s ease;
  }

  /* Gạch chéo khi đang tắt */
  #music-slash {
    position: absolute;

    width: 34px;
    height: 2.6px;

    background: linear-gradient(
      90deg,
      var(--brown-slash),
      var(--brown-main)
    );

    border-radius: 20px;

    transform: rotate(45deg);

    opacity: 1;
    transition: 0.25s ease;
  }

  /* Trạng thái đang phát */
  #music-toggle.playing {
    background: linear-gradient(
      135deg,
      rgba(242, 231, 224, 0.98),
      rgba(252, 249, 247, 0.98)
    );

    box-shadow:
      0 0 0 7px rgba(138, 68, 37, 0.12),
      0 0 22px var(--brown-glow),
      0 8px 24px rgba(95, 37, 16, 0.18),
      inset 0 0 0 1px rgba(122, 53, 25, 0.66);
  }

  #music-toggle.playing #music-slash {
    opacity: 0;
    transform: rotate(45deg) scale(0.7);
  }

  #music-toggle.playing #music-icon {
    color: var(--brown-dark);
    animation: musicSpin 4.2s linear infinite;
  }

  /* Vòng sáng nâu đỏ nhạt */
  #music-toggle.playing::after {
    content: "";
    position: absolute;

    width: 74px;
    height: 74px;

    border-radius: 50%;

    right: -10px;
    bottom: -10px;

    z-index: -1;

    background: radial-gradient(
      circle,
      rgba(138, 68, 37, 0.25),
      transparent 58%
    );

    animation: brownPulse 1.9s infinite;
  }

  /* Nốt nhạc nhỏ bay nhẹ */
  #music-toggle.playing::before {
    content: "♪";
    position: absolute;

    top: -10px;
    right: 2px;

    font-size: 17px;
    color: rgba(95, 37, 16, 0.68);

    animation: musicFloat 1.8s ease-in-out infinite;
  }

  @keyframes musicSpin {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  @keyframes brownPulse {
    0% {
      transform: scale(0.82);
      opacity: 0.35;
    }

    70% {
      transform: scale(1.22);
      opacity: 0;
    }

    100% {
      transform: scale(1.36);
      opacity: 0;
    }
  }

  @keyframes musicFloat {
    0% {
      transform: translateY(4px) scale(0.9);
      opacity: 0;
    }

    45% {
      opacity: 1;
    }

    100% {
      transform: translateY(-10px) scale(1.12);
      opacity: 0;
    }
  }

  @media (max-width: 768px) {
    #music-toggle {
      width: 50px;
      height: 50px;

      right: 16px;
      bottom: 16px;
    }

    #music-icon {
      width: 29px;
      height: 29px;
    }
  }
</style>

<button id="music-toggle" type="button" aria-label="Bật/tắt nhạc" title="Bật nhạc" aria-pressed="false">

  <svg id="music-icon" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
    <path d="M42 9.5c1.2-.35 2.4.55 2.4 1.8v27.15c0 5.15-4.35 9.35-9.7 9.35-4.65 0-8.4-3.1-8.4-6.95s3.75-6.95 8.4-6.95c1.75 0 3.4.45 4.75 1.25V21.2l-18.9 5.35v19.1c0 5.15-4.35 9.35-9.7 9.35-4.65 0-8.4-3.1-8.4-6.95s3.75-6.95 8.4-6.95c1.75 0 3.4.45 4.75 1.25V20.3c0-1.05.7-2 1.7-2.3L42 9.5Z"></path>
    <path d="M51.7 18.2c1.1-2 4-2 5.1 0 .65 1.2.45 2.7-.55 3.7l-4.55 4.45-4.55-4.45c-1-.95-1.2-2.5-.55-3.7 1.1-2 4-2 5.1 0Z" opacity="0.9"></path>
  </svg>

  <span id="music-slash"></span>

</button>

<script>
  const musicList = [
    "https://files.catbox.moe/mijy4g.mp3"
  ];

  let index = 0;
  let audio = new Audio(musicList[index]);

  audio.preload = "auto";
  audio.volume = 0.65;
  audio.loop = musicList.length === 1;

  let musicStarted = false;
  let isPlaying = false;

  const toggleBtn = document.getElementById("music-toggle");

  function updateIcon() {
    if (isPlaying) {
      toggleBtn.classList.add("playing");

      toggleBtn.setAttribute("aria-pressed", "true");
      toggleBtn.setAttribute("title", "Tắt nhạc");
      toggleBtn.setAttribute("aria-label", "Tắt nhạc");
    } else {
      toggleBtn.classList.remove("playing");

      toggleBtn.setAttribute("aria-pressed", "false");
      toggleBtn.setAttribute("title", "Bật nhạc");
      toggleBtn.setAttribute("aria-label", "Bật nhạc");
    }
  }

  function safePlay() {
    return audio.play()
      .then(() => {
        musicStarted = true;
        isPlaying = true;

        updateIcon();
        removeAutoPlayEvents();
      })
      .catch((err) => {
        console.debug("Audio play blocked:", err);
      });
  }

  function pauseMusic() {
    audio.pause();

    isPlaying = false;

    updateIcon();
  }

  function nextMusic() {
    if (musicList.length <= 1) return;

    index = (index + 1) % musicList.length;
    audio.src = musicList[index];

    safePlay();
  }

  audio.addEventListener("ended", nextMusic);

  function startMusicOnFirstGesture(event) {
    if (musicStarted) return;

    if (event && toggleBtn.contains(event.target)) {
      return;
    }

    safePlay();
  }

  function addAutoPlayEvents() {
    document.addEventListener("wheel", startMusicOnFirstGesture, { passive: true });
    document.addEventListener("scroll", startMusicOnFirstGesture, { passive: true });
    document.addEventListener("mousemove", startMusicOnFirstGesture, { passive: true });
    document.addEventListener("touchstart", startMusicOnFirstGesture, { passive: true });
    document.addEventListener("touchmove", startMusicOnFirstGesture, { passive: true });
  }

  function removeAutoPlayEvents() {
    document.removeEventListener("wheel", startMusicOnFirstGesture);
    document.removeEventListener("scroll", startMusicOnFirstGesture);
    document.removeEventListener("mousemove", startMusicOnFirstGesture);
    document.removeEventListener("touchstart", startMusicOnFirstGesture);
    document.removeEventListener("touchmove", startMusicOnFirstGesture);
  }

  toggleBtn.addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();

    if (isPlaying) {
      pauseMusic();
    } else {
      safePlay();
    }
  });

  toggleBtn.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      toggleBtn.click();
    }
  });

  addAutoPlayEvents();
  updateIcon();
</script>
